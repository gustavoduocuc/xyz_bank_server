# Static scrape configuration for the local stack (docker-compose.override.yml only).
# Every job resolves its service name through Docker DNS (type A), so each replica started with
# `--scale` is its own target. auth-server and the BFFs are scraped on their internal management port.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: config-server
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [config-server]
        type: A
        port: 8888
  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [eureka-server]
        type: A
        port: 8761
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [api-gateway]
        type: A
        port: 8090
  - job_name: core-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [core-service]
        type: A
        port: 8080
  - job_name: customers-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [customers-service]
        type: A
        port: 8085
  - job_name: payments-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [payments-service]
        type: A
        port: 8086
  - job_name: interests-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [interests-service]
        type: A
        port: 8084
  - job_name: auth-server
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [auth-server]
        type: A
        port: 9100
  - job_name: bff-web
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [bff-web]
        type: A
        port: 9081
  - job_name: bff-mobile
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [bff-mobile]
        type: A
        port: 9082
  - job_name: bff-atm
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [bff-atm]
        type: A
        port: 9083
