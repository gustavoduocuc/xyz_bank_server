server:
  port: 8080

spring:
  application:
    name: core-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core_service}
    username: ${DB_USERNAME:core_service}
    password: ${DB_PASSWORD:core_service}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:false}
      ack-mode: record
      # One consumer thread per partition: accounts are processed in parallel, one account in order
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    consumer:
      group-id: core-service-interests
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  withdrawals:
    daily-limit: 5000.00
  events:
    transaction-confirmed:
      enabled: ${FEATURE_TRANSACTION_CONFIRMED_EVENTS:false}
      topic: transactions.confirmed
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:1000}

interests:
  kafka:
    enabled: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:false}
    calculated-topic: interests.calculated
    credit-results-topic: interests.credit-results
    # One partition per consumer thread; records are keyed by account id, so one account stays on one partition
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    # A failing record is retried (blocking, to keep per-account order) and then dead-lettered:
    # 1 s, 2 s, 4 s (~7 s) is long enough for a transient failure and short enough to free the partition
    retry:
      max-retries: 3
      initial-interval-ms: 1000
      multiplier: 2.0

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
    register-with-eureka: true
    # Needed to resolve customers-service by its Eureka id (@LoadBalanced) when opening accounts
    fetch-registry: true
  instance:
    prefer-ip-address: true

security:
  pin-verification-tls:
    port: 8453
    keystore-path: ${TLS_PIN_KEYSTORE_PATH:classpath:tls/keystore.p12}
    keystore-password: ${TLS_PIN_KEYSTORE_PASSWORD:xyzbank-dev}
    keystore-type: PKCS12
  enforcement:
    enabled: true

# Access tokens are issued by auth-server and verified here with its public keys only
# (adopt-oauth2-tokens-between-services design.md Decision 4): core-service holds no signing secret.
auth:
  issuer: ${AUTH_ISSUER:https://localhost:9000}
  jwk-set-uri: ${AUTH_JWK_SET_URI:https://localhost:9000/oauth2/jwks}
  audience: core-service
  channel-clients:
    WEB: bff-web
    MOBILE: bff-mobile
    ATM: bff-atm
    INTERESTS: interests-service
    ACCOUNTS_ADMIN: accounts-admin
    PAYMENTS: payments-service

resilience4j:
  circuitbreaker:
    instances:
      customersService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 2
        # An open breaker must not turn core-service's health DOWN
        registerHealthIndicator: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId}] [%15.15t] %-40.40logger{39} : %m%n"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
