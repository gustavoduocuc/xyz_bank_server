server:
  port: 8080

spring:
  application:
    name: core-service
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core_service}
    username: ${DB_USERNAME:core_service}
    password: ${DB_PASSWORD:core_service}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false
      ack-mode: record
    consumer:
      group-id: core-service-interests
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  withdrawals:
    daily-limit: 5000.00

interests:
  kafka:
    enabled: false
    calculated-topic: interests.calculated
    credit-results-topic: interests.credit-results
  outbox:
    relay-delay-ms: 1000

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true

security:
  pin-verification-tls:
    port: 8453
    keystore-path: ${TLS_PIN_KEYSTORE_PATH:classpath:tls/keystore.p12}
    keystore-password: ${TLS_PIN_KEYSTORE_PASSWORD:xyzbank-dev}
    keystore-type: PKCS12
  enforcement:
    enabled: true
  service-credentials:
    web: ${SERVICE_CREDENTIAL_WEB:dev-service-credential-web}
    mobile: ${SERVICE_CREDENTIAL_MOBILE:dev-service-credential-mobile}
    atm: ${SERVICE_CREDENTIAL_ATM:dev-service-credential-atm}
    interests: ${SERVICE_CREDENTIAL_INTERESTS:dev-service-credential-interests}

channel-auth:
  jwt:
    secret: ${CHANNEL_AUTH_JWT_SECRET:dev-channel-auth-jwt-signing-secret-please-rotate-in-prod}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId}] [%15.15t] %-40.40logger{39} : %m%n"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
