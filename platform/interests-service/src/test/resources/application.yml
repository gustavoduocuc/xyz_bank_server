spring:
  config:
    import: "optional:configserver:"
  cloud:
    compatibility-verifier:
      enabled: false
    config:
      enabled: false
    loadbalancer:
      enabled: false

core-service:
  base-url: http://localhost:9999
  connect-timeout-ms: 3000
  read-timeout-ms: 3000

interests:
  annual-rate: 0.035

auth:
  issuer: https://localhost:9000
  jwk-set-uri: http://localhost:9997/oauth2/jwks
  audience: interests-service
  channel-clients:
    WEB: bff-web
    MOBILE: bff-mobile
    ATM: bff-atm
    INTERESTS: interests-service
  token-uri: http://localhost:9997/oauth2/token
  client-id: interests-service
  client-secret: interests-service-test-secret

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    instances:
      coreServiceInterests:
        registerHealthIndicator: true
        slidingWindowSize: 4
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - cl.duoc.xyzbank.interestsservice.shared.domain.DomainException
  retry:
    instances:
      coreServiceInterests:
        maxAttempts: 1
        waitDuration: 100ms
        ignoreExceptions:
          - cl.duoc.xyzbank.interestsservice.shared.domain.DomainException
  timelimiter:
    instances:
      coreServiceInterests:
        timeoutDuration: 2s

logging:
  level:
    io.github.resilience4j: DEBUG
