spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false

core-service:
  base-url: http://localhost:8080
  connect-timeout-ms: 3000
  read-timeout-ms: 3000

interests:
  annual-rate: 0.035

# Access tokens (adopt-oauth2-tokens-between-services): incoming ones are verified with
# auth-server's public keys only; outgoing calls to core-service use interests-service's own
# client_credentials token. No signing secret is configured here.
auth:
  issuer: ${AUTH_ISSUER:https://localhost:9000}
  jwk-set-uri: ${AUTH_JWK_SET_URI:https://localhost:9000/oauth2/jwks}
  audience: interests-service
  channel-clients:
    WEB: bff-web
    MOBILE: bff-mobile
    ATM: bff-atm
    INTERESTS: interests-service
  token-uri: ${AUTH_TOKEN_URI:https://localhost:9000/oauth2/token}
  client-id: interests-service
  client-secret: ${INTERESTS_SERVICE_CLIENT_SECRET:interests-service-dev-secret}

eureka:
  client:
    enabled: false

spring.cloud.loadbalancer.enabled: false

resilience4j:
  circuitbreaker:
    instances:
      coreServiceInterests:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      coreServiceInterests:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2
