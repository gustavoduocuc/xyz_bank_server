server:
  port: 8084

spring:
  application:
    name: interests-service
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    compatibility-verifier:
      enabled: false
  # One shared PostgreSQL; interests-service reads and writes only the interests schema
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core_service}
    username: ${DB_USERNAME:core_service}
    password: ${DB_PASSWORD:core_service}
  flyway:
    enabled: true
    schemas: interests
    default-schema: interests
  kafka:
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true
      auto-startup: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:false}
      ack-mode: record
      # One consumer thread per partition: accounts are processed in parallel, one account in order
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    consumer:
      group-id: interests-service-credit-results
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,refresh,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

interests:
  kafka:
    enabled: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:false}
    calculated-topic: interests.calculated
    credit-results-topic: interests.credit-results
    # One partition per consumer thread; records are keyed by account id, so one account stays on one partition
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    # A failing record is retried (blocking, to keep per-account order) and then dead-lettered:
    # 1 s, 2 s, 4 s (~7 s) is long enough for a transient failure and short enough to free the partition
    retry:
      max-retries: 3
      initial-interval-ms: 1000
      multiplier: 2.0
