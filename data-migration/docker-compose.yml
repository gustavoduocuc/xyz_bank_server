services:
  mysql:
    image: mysql:8.4
    container_name: xyz-bank-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: xyz_bank_migration
      MYSQL_USER: migration
      MYSQL_PASSWORD: migration
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - xyz_bank_mysql_data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  xyz_bank_mysql_data:
