server:
  port: 8083
  ssl:
    enabled: true
    key-store: ${TLS_KEYSTORE_PATH:classpath:tls/keystore.p12}
    key-store-password: ${TLS_KEYSTORE_PASSWORD:xyzbank-dev}
    key-store-type: PKCS12
    trust-store: ${TLS_TRUSTSTORE_PATH:classpath:tls/truststore.p12}
    trust-store-password: ${TLS_TRUSTSTORE_PASSWORD:xyzbank-dev}
    trust-store-type: PKCS12
    client-auth: need
  compression:
    enabled: true

spring:
  application:
    name: bff-atm
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    compatibility-verifier:
      enabled: false

core-service:
  # PIN verification goes straight to core-service's mutual-TLS connector, not through the gateway
  pin-verification-base-url: ${CORE_SERVICE_PIN_VERIFICATION_BASE_URL:https://localhost:8453}

auth-server:
  token-uri: ${AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}
  client-id: ${BFF_ATM_CLIENT_ID:bff-atm}
  client-secret: ${BFF_ATM_CLIENT_SECRET:bff-atm-dev-secret}
  # design.md Decision 2: token issuance signs and writes to Postgres; 3 s bounds it
  connect-timeout-ms: 1000
  read-timeout-ms: 3000

channel-auth:
  jwt:
    secret: ${BFF_ATM_SESSION_SECRET:dev-channel-auth-jwt-signing-secret-please-rotate-in-prod}

# Fault tolerance of bff-atm's outbound calls (bff-resilience spec; parameters justified in
# add-resilience4j-to-bffs design.md Decisions 3 and 4)
resilience4j:
  circuitbreaker:
    configs:
      downstream:
        slidingWindowType: COUNT_BASED
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # An open breaker must never turn health DOWN (one outage would cascade through compose)
        registerHealthIndicator: false
        # Unreachable, timed out or 5xx; a 4xx is an answer, not a failure
        recordFailurePredicate: cl.duoc.xyzbank.bffatm.shared.infrastructure.resilience.DownstreamFailurePredicate
        # Another dependency's outage belongs to that dependency's breaker
        ignoreExceptions:
          - cl.duoc.xyzbank.bffatm.shared.application.DependencyUnavailableException
    instances:
      coreService:
        baseConfig: downstream
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
      authServer:
        baseConfig: downstream
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    # No shared retry baseConfig: in 2.2.0 an instance that inherits a backoff and sets its own
    # wait fails with "intervalFunction was configured twice". Every instance retries only after
    # unreachable, timed out, 502, 503 or 504; never a 4xx, a 500 or an open circuit.
    instances:
      # GET reads: ~200 ms then ~400 ms (+/-50 %) between the three attempts
      coreServiceRead:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptionPredicate: cl.duoc.xyzbank.bffatm.shared.infrastructure.resilience.RetryableFailurePredicate
        ignoreExceptions: &notRetried
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - cl.duoc.xyzbank.bffatm.shared.application.DependencyUnavailableException
      # One retry only, with the terminal's own Idempotency-Key (design.md Decision 5)
      coreServiceWithdrawal:
        maxAttempts: 2
        waitDuration: 300ms
        retryExceptionPredicate: cl.duoc.xyzbank.bffatm.shared.infrastructure.resilience.RetryableFailurePredicate
        ignoreExceptions: *notRetried
      # client_credentials has no side effect, so it may be repeated: ~300 ms then ~600 ms
      authServerToken:
        maxAttempts: 3
        waitDuration: 300ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptionPredicate: cl.duoc.xyzbank.bffatm.shared.infrastructure.resilience.RetryableFailurePredicate
        ignoreExceptions: *notRetried
  # PIN verification has no retry instance on purpose: an extra attempt can lock the card

# Actuator lives on an internal, plain-HTTP management port (published on loopback only by the
# local stack), so circuit-breaker state never reaches the customer-facing port. The customer-
# facing port keeps answering /actuator/health through PublicHealthController
# (add-resilience4j-to-bffs design.md Decision 8)
# Registers in Eureka when EUREKA_CLIENT_ENABLED is true (the Compose stack); off for local runs and tests
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9083}
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: never
  health:
    # An open breaker must not turn health DOWN
    circuitbreakers:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId}] [%15.15t] %-40.40logger{39} : %m%n"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
