server:
  port: 8081
  ssl:
    enabled: true
    key-store: ${TLS_KEYSTORE_PATH:classpath:tls/keystore.p12}
    key-store-password: ${TLS_KEYSTORE_PASSWORD:xyzbank-dev}
    key-store-type: PKCS12
  compression:
    enabled: true

spring:
  application:
    name: bff-web
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    compatibility-verifier:
      enabled: false
  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: ${OIDC_CLIENT_ID:xyz-bank-web-dev}
            client-secret: ${OIDC_CLIENT_SECRET:xyz-bank-web-dev-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # Exactly the web channel's scope set (Channel.WEB): the authorization server refuses
            # the whole request if it contains any scope not registered for bff-web
            scope: openid,profile,web:accounts:read,web:customers:read,web:transactions:read,web:interests:read
        provider:
          oidc:
            authorization-uri: ${OIDC_AUTHORIZATION_URI:http://localhost:9999/mock-oidc/authorize}
            token-uri: ${OIDC_TOKEN_URI:http://localhost:9999/mock-oidc/token}
            jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:9999/mock-oidc/jwks}
            user-name-attribute: sub

oidc:
  # The "iss" every ID token must carry; defaults to the test suite's mock provider
  expected-issuer: ${OIDC_ISSUER:http://localhost:9999/mock-oidc}

auth-server:
  connect-timeout-ms: 1000
  read-timeout-ms: 3000

features:
  interests:
    use-interests-service: ${FEATURE_USE_INTERESTS_SERVICE:true}

# Fault tolerance of bff-web's outbound calls (bff-resilience spec; parameters justified in
# add-resilience4j-to-bffs design.md Decisions 3 and 4)
resilience4j:
  circuitbreaker:
    configs:
      downstream:
        slidingWindowType: COUNT_BASED
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # An open breaker must never turn health DOWN (one outage would cascade through compose)
        registerHealthIndicator: false
        # Unreachable, timed out, cut off or 5xx; a 4xx is an answer, not a failure
        recordFailurePredicate: cl.duoc.xyzbank.bffweb.shared.infrastructure.resilience.DownstreamFailurePredicate
        # Another dependency's outage belongs to that dependency's breaker
        ignoreExceptions:
          - cl.duoc.xyzbank.bffweb.shared.application.DependencyUnavailableException
    instances:
      coreService:
        baseConfig: downstream
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
      interestsService:
        baseConfig: downstream
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
      customersService:
        baseConfig: downstream
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 3
      authServer:
        baseConfig: downstream
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    # No shared retry baseConfig: in 2.2.0 an instance that inherits a backoff and sets its own
    # wait fails with "intervalFunction was configured twice". Reads retry only after unreachable,
    # timed out, cut off, 502, 503 or 504; never a 4xx, a 500 or an open circuit. Nothing that
    # talks to auth-server is retried (refresh rotation, single-use codes).
    instances:
      # ~200 ms then ~400 ms (+/-50 %) between the three attempts
      coreServiceRead:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptionPredicate: cl.duoc.xyzbank.bffweb.shared.infrastructure.resilience.RetryableFailurePredicate
        ignoreExceptions: &notRetried
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - cl.duoc.xyzbank.bffweb.shared.application.DependencyUnavailableException
      customersServiceRead:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptionPredicate: cl.duoc.xyzbank.bffweb.shared.infrastructure.resilience.RetryableFailurePredicate
        ignoreExceptions: *notRetried
      interestsServiceRead:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptionPredicate: cl.duoc.xyzbank.bffweb.shared.infrastructure.resilience.RetryableFailurePredicate
        ignoreExceptions: *notRetried

# Actuator lives on an internal, plain-HTTP management port (published on loopback only by the
# local stack), so circuit-breaker state never reaches the customer-facing port. The customer-
# facing port keeps answering /actuator/health through PublicHealthController
# (add-resilience4j-to-bffs design.md Decision 8)
# Registers in Eureka when EUREKA_CLIENT_ENABLED is true (the Compose stack); off for local runs and tests
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9081}
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: never
  health:
    # An open breaker must not turn health DOWN
    circuitbreakers:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId}] [%15.15t] %-40.40logger{39} : %m%n"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
