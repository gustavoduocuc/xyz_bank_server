# ══════════════════════════════════════════════════════════════════════════════
# Configuración centralizada de interests-service
# Cambios aquí se reflejan con POST /actuator/refresh (sin redeploy)
# ══════════════════════════════════════════════════════════════════════════════

core-service:
  # Eureka service id (LoadBalancer); no host/puerto fijos
  base-url: http://core-service
  connect-timeout-ms: 3000
  read-timeout-ms: 3000

interests:
  annual-rate: ${INTERESTS_ANNUAL_RATE:0.035}

# Access tokens (adopt-oauth2-tokens-between-services): incoming ones are verified with
# auth-server's public keys only; outgoing calls to core-service use interests-service's own
# client_credentials token. No signing secret is configured here.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER:https://localhost:9000}
          jwk-set-uri: ${AUTH_JWK_SET_URI:https://localhost:9000/oauth2/jwks}
          audiences:
            - interests-service

auth:
  channel-clients:
    WEB: bff-web
    MOBILE: bff-mobile
    ATM: bff-atm
    INTERESTS: interests-service
  token-uri: ${AUTH_TOKEN_URI:https://localhost:9000/oauth2/token}
  client-id: interests-service
  client-secret: ${INTERESTS_SERVICE_CLIENT_SECRET:interests-service-dev-secret}
  connect-timeout-ms: 1000
  read-timeout-ms: 3000

# Resilience4j - Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      coreServiceInterests:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # A token outage is the authorization server's, not core-service's
        ignoreExceptions:
          - cl.duoc.xyzbank.interestsservice.shared.domain.ServiceTokenUnavailableException
      # interests-service's own client_credentials request (add-resilience4j-to-bffs design.md
      # Decision 3): unreachable, timed out or 5xx only; a 4xx never opens it
      authServer:
        registerHealthIndicator: false
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordFailurePredicate: cl.duoc.xyzbank.interestsservice.shared.infrastructure.resilience.DownstreamFailurePredicate
  retry:
    instances:
      coreServiceInterests:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2
        ignoreExceptions:
          - cl.duoc.xyzbank.interestsservice.shared.domain.ServiceTokenUnavailableException
      # Requesting a token has no side effect, so it may be repeated: ~300 ms then ~600 ms
      # (+/-50 %), only after unreachable, timed out, 502, 503 or 504 (Decision 4)
      authServerToken:
        maxAttempts: 3
        waitDuration: 300ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptionPredicate: cl.duoc.xyzbank.interestsservice.shared.infrastructure.resilience.RetryableFailurePredicate
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  timelimiter:
    instances:
      coreServiceInterests:
        timeoutDuration: 5s
        cancelRunningFuture: true

# Logging level (ajustable sin redeploy)
logging:
  level:
    cl.duoc.xyzbank.interestsservice: INFO
    io.github.resilience4j: DEBUG
