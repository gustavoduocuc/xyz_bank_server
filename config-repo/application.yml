# ══════════════════════════════════════════════════════════════════════════════
# Configuración común a todos los servicios que leen de config-server
# ══════════════════════════════════════════════════════════════════════════════

# Distributed tracing (W3C traceparent). Spans go to Zipkin; lower the probability under load.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

# One console pattern for every service that reads from config-server: application name, trace and
# span ids (from tracing) and the correlation id (MDC, set where a CorrelationIdFilter exists)
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}] [%15.15t] %-40.40logger{39} : %m%n"
