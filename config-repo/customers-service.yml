# ══════════════════════════════════════════════════════════════════════════════
# Configuración centralizada de customers-service
# ══════════════════════════════════════════════════════════════════════════════

# Access tokens are verified with auth-server's public keys only; no signing secret here.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER:https://localhost:9000}
          jwk-set-uri: ${AUTH_JWK_SET_URI:https://localhost:9000/oauth2/jwks}
          audiences:
            - customers-service
