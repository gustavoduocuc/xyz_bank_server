services:
  mysql:
    image: mysql:8.4
    container_name: xyz-bank-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: xyz_bank_migration
      MYSQL_USER: migration
      MYSQL_PASSWORD: migration
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - xyz_bank_mysql_data:/var/lib/mysql
      - ./data-migration/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: xyz-bank-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: core_service
      POSTGRES_USER: core_service
      POSTGRES_PASSWORD: core_service
    volumes:
      - xyz_bank_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_service -d core_service"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-postgres:
    # auth-server's own database (OAuth authorizations and registered clients), separate from
    # core_service: own container, database, user and volume, not published on the host
    image: postgres:16-alpine
    container_name: xyz-bank-auth-postgres
    environment:
      POSTGRES_DB: auth_server
      POSTGRES_USER: ${AUTH_DB_USERNAME:-auth_server}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth_server}
    volumes:
      - xyz_bank_auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auth_server"]
      interval: 5s
      timeout: 5s
      retries: 20

  data-migration:
    build:
      context: .
      dockerfile: data-migration/Dockerfile
    container_name: xyz-bank-data-migration
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: xyz_bank_migration
      DB_USERNAME: migration
      DB_PASSWORD: migration
      MIGRATION_RUN_ALL: "true"

  config-server:
    build:
      context: .
      dockerfile: platform/config-server/Dockerfile
    container_name: xyz-bank-config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      CONFIG_REPO_PATH: /config-repo
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8888/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  eureka-server:
    build:
      context: .
      dockerfile: platform/eureka-server/Dockerfile
    container_name: xyz-bank-eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  core-service:
    build:
      context: .
      dockerfile: platform/core-service/Dockerfile
    container_name: xyz-bank-core-service
    ports:
      - "8080:8080"
      - "8453:8453"
    volumes:
      - ./dev/certs/core-service/keystore.p12:/certs/keystore.p12:ro
      - ./dev/certs/truststore.p12:/certs/truststore.p12:ro
    depends_on:
      postgres:
        condition: service_healthy
      data-migration:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: core_service
      DB_USERNAME: core_service
      DB_PASSWORD: core_service
      TLS_PIN_KEYSTORE_PATH: file:/certs/keystore.p12
      TLS_PIN_KEYSTORE_PASSWORD: xyzbank-dev
      AUTH_ISSUER: https://localhost:9000
      AUTH_JWK_SET_URI: https://auth-server:9000/oauth2/jwks
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=xyzbank-dev -Djavax.net.ssl.trustStoreType=PKCS12
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: http://eureka-server:8761
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FEATURE_INTEREST_CREDIT_VIA_KAFKA: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:-false}
      FEATURE_TRANSACTION_CONFIRMED_EVENTS: ${FEATURE_TRANSACTION_CONFIRMED_EVENTS:-true}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  kafka:
    image: apache/kafka:3.8.1
    container_name: xyz-bank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: xyz-bank-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic interests.calculated --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic interests.credit-results --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.confirmed --partitions 1 --replication-factor 1

  interests-service:
    build:
      context: .
      dockerfile: platform/interests-service/Dockerfile
    container_name: xyz-bank-interests-service
    ports:
      - "8084:8084"
    volumes:
      - ./dev/certs/truststore.p12:/certs/truststore.p12:ro
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      core-service:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761
      AUTH_ISSUER: https://localhost:9000
      AUTH_JWK_SET_URI: https://auth-server:9000/oauth2/jwks
      AUTH_TOKEN_URI: https://auth-server:9000/oauth2/token
      INTERESTS_SERVICE_CLIENT_SECRET: ${INTERESTS_SERVICE_CLIENT_SECRET:-interests-service-dev-secret}
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=xyzbank-dev -Djavax.net.ssl.trustStoreType=PKCS12
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FEATURE_INTEREST_CREDIT_VIA_KAFKA: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:-false}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  auth-server:
    build:
      context: .
      dockerfile: platform/auth-server/Dockerfile
    container_name: xyz-bank-auth-server
    ports:
      - "9000:9000"
    volumes:
      - ./dev/certs/auth-server/keystore.p12:/certs/keystore.p12:ro
      - ./dev/certs/auth-server/signing.p12:/certs/signing.p12:ro
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/auth_server
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-auth_server}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_server}
      TLS_KEYSTORE_PATH: file:/certs/keystore.p12
      TLS_KEYSTORE_PASSWORD: xyzbank-dev
      # Public issuer: the URL the browser uses. Tokens carry it even when a BFF container
      # reaches this server as https://auth-server:9000 (design.md Decision 1)
      AUTH_ISSUER: https://localhost:9000
      # Mounted, persistent signing key: restarting this container keeps issued tokens valid
      AUTH_SIGNING_KEYSTORE_PATH: file:/certs/signing.p12
      AUTH_SIGNING_KEYSTORE_PASSWORD: xyzbank-dev
      AUTH_SIGNING_KEY_ALIAS: auth-server-signing
      BFF_WEB_CLIENT_SECRET: ${BFF_WEB_CLIENT_SECRET:-bff-web-dev-secret}
      BFF_MOBILE_CLIENT_SECRET: ${BFF_MOBILE_CLIENT_SECRET:-bff-mobile-dev-secret}
      BFF_ATM_CLIENT_SECRET: ${BFF_ATM_CLIENT_SECRET:-bff-atm-dev-secret}
      INTERESTS_SERVICE_CLIENT_SECRET: ${INTERESTS_SERVICE_CLIENT_SECRET:-interests-service-dev-secret}
      AUTH_DEMO_PASSWORD: ${AUTH_DEMO_PASSWORD:-demo-password}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-check-certificate -qO- https://127.0.0.1:9000/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  bff-web:
    build:
      context: .
      dockerfile: bff/bff-web/Dockerfile
    container_name: xyz-bank-bff-web
    ports:
      - "8081:8081"
    volumes:
      - ./dev/certs/bff-web/keystore.p12:/certs/keystore.p12:ro
      - ./dev/certs/truststore.p12:/certs/truststore.p12:ro
    depends_on:
      core-service:
        condition: service_healthy
      interests-service:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    environment:
      CORE_SERVICE_BASE_URL: http://core-service:8080
      INTERESTS_SERVICE_BASE_URL: http://interests-service:8084
      FEATURE_USE_INTERESTS_SERVICE: ${FEATURE_USE_INTERESTS_SERVICE:-true}
      TLS_KEYSTORE_PATH: file:/certs/keystore.p12
      TLS_KEYSTORE_PASSWORD: xyzbank-dev
      # OIDC against auth-server (design.md Decision 1): the browser is sent to the public
      # authorization URL, while this container exchanges codes and fetches keys over the
      # Docker network; the ID token's issuer is checked against the public URL
      OIDC_CLIENT_ID: bff-web
      OIDC_CLIENT_SECRET: ${BFF_WEB_CLIENT_SECRET:-bff-web-dev-secret}
      OIDC_AUTHORIZATION_URI: https://localhost:9000/oauth2/authorize
      OIDC_TOKEN_URI: https://auth-server:9000/oauth2/token
      OIDC_JWK_SET_URI: https://auth-server:9000/oauth2/jwks
      OIDC_ISSUER: https://localhost:9000
      # Trust the dev CA for the TLS calls to auth-server. This replaces the JVM's default
      # CAs, which is fine because this BFF makes no other TLS client calls (design.md Decision 6)
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=xyzbank-dev -Djavax.net.ssl.trustStoreType=PKCS12
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-check-certificate -qO- https://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  bff-mobile:
    build:
      context: .
      dockerfile: bff/bff-mobile/Dockerfile
    container_name: xyz-bank-bff-mobile
    ports:
      - "8082:8082"
    volumes:
      - ./dev/certs/bff-mobile/keystore.p12:/certs/keystore.p12:ro
      - ./dev/certs/truststore.p12:/certs/truststore.p12:ro
    depends_on:
      core-service:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    environment:
      CORE_SERVICE_BASE_URL: http://core-service:8080
      TLS_KEYSTORE_PATH: file:/certs/keystore.p12
      TLS_KEYSTORE_PASSWORD: xyzbank-dev
      # OIDC against auth-server as a confidential client; same public/internal URL
      # split as bff-web (design.md Decision 1)
      OIDC_CLIENT_ID: bff-mobile
      OIDC_CLIENT_SECRET: ${BFF_MOBILE_CLIENT_SECRET:-bff-mobile-dev-secret}
      AUTH_SERVER_BASE_URL: https://auth-server:9000
      OIDC_AUTHORIZATION_URI: https://localhost:9000/oauth2/authorize
      OIDC_TOKEN_URI: https://auth-server:9000/oauth2/token
      OIDC_JWK_SET_URI: https://auth-server:9000/oauth2/jwks
      OIDC_ISSUER: https://localhost:9000
      # Trust the dev CA for the TLS calls to auth-server (design.md Decision 6)
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=xyzbank-dev -Djavax.net.ssl.trustStoreType=PKCS12
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-check-certificate -qO- https://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  bff-atm:
    build:
      context: .
      dockerfile: bff/bff-atm/Dockerfile
    container_name: xyz-bank-bff-atm
    ports:
      - "8083:8083"
    volumes:
      - ./dev/certs/bff-atm/keystore.p12:/certs/keystore.p12:ro
      - ./dev/certs/truststore.p12:/certs/truststore.p12:ro
      - ./dev/certs/atm-terminal/keystore.p12:/certs/terminal-keystore.p12:ro
    depends_on:
      core-service:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    environment:
      CORE_SERVICE_BASE_URL: http://core-service:8080
      CORE_SERVICE_PIN_VERIFICATION_BASE_URL: https://core-service:8453
      AUTH_TOKEN_URI: https://auth-server:9000/oauth2/token
      BFF_ATM_CLIENT_ID: bff-atm
      BFF_ATM_CLIENT_SECRET: ${BFF_ATM_CLIENT_SECRET:-bff-atm-dev-secret}
      BFF_ATM_SESSION_SECRET: ${BFF_ATM_SESSION_SECRET:-dev-channel-auth-jwt-signing-secret-please-rotate-in-prod}
      TLS_KEYSTORE_PATH: file:/certs/keystore.p12
      TLS_KEYSTORE_PASSWORD: xyzbank-dev
      TLS_TRUSTSTORE_PATH: file:/certs/truststore.p12
      TLS_TRUSTSTORE_PASSWORD: xyzbank-dev
      JAVA_TOOL_OPTIONS: -Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=xyzbank-dev -Djavax.net.ssl.trustStoreType=PKCS12
    healthcheck:
      # bff-atm's connector requires a client certificate (client-auth: need), so even
      # the health check must present one: it uses the same dev terminal certificate a
      # real ATM terminal would, via curl (busybox wget cannot present a client cert)
      test: ["CMD", "sh", "-c", "curl -sk --cert-type P12 --cert /certs/terminal-keystore.p12:xyzbank-dev https://127.0.0.1:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  xyz_bank_mysql_data:
  xyz_bank_postgres_data:
  xyz_bank_auth_postgres_data:
