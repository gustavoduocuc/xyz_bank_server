openapi: 3.0.3
info:
  title: core-service — accounts
  description: >
    Internal, read-only endpoints for customer profiles and account balances.
    core-service is the only component with database access; these endpoints
    are internal-network-only and are not exposed through any BFF.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
paths:
  /internal/customers/{customerId}:
    get:
      summary: Get a customer's profile
      operationId: getCustomerProfile
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: The customer's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/customers/{customerId}/accounts:
    get:
      summary: List the accounts owned by a customer
      operationId: listAccountsForCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: >
            The accounts owned by the customer. An empty array when the
            customer exists but owns no accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/accounts/{accountId}/balance:
    get:
      summary: Get an account's current balance
      operationId: getAccountBalance
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account's current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/accounts/{accountId}/transactions:
    get:
      summary: List an account's transactions
      description: >
        Cursor-paginated, ordered most-recent-first. Pass a previous response's
        nextCursor value back as the cursor parameter to fetch the next page.
        pageSize is capped at 100 (returning fewer items, not an error) and
        defaults to 20 when omitted.
      operationId: listAccountTransactions
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: from
          in: query
          description: Inclusive lower date bound (yyyy-MM-dd)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclusive upper date bound (yyyy-MM-dd)
          schema:
            type: string
            format: date
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum: [DEBIT, CREDIT]
        - name: cursor
          in: query
          description: >
            Opaque continuation token from a previous page's nextCursor.
            Omit for the first page. Never construct or decode this value.
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum items per page. Clamped at 100; defaults to 20.
          schema:
            type: integer
      responses:
        '200':
          description: A page of the account's transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/transactions/{transactionId}:
    get:
      summary: Get a transaction's detail
      operationId: getTransactionDetail
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The transaction's detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/accounts/{accountId}/interest-summary:
    get:
      summary: Get an account's annual interest summary
      operationId: getAnnualInterestSummary
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The account's annual interest summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnualInterestSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/accounts/{accountId}/withdrawals:
    post:
      summary: Withdraw an amount from an account
      description: >
        The platform's only write operation. Requires an Idempotency-Key
        header: retrying the same key with the same account and amount
        replays the original result rather than withdrawing twice; the same
        key with different parameters is rejected as a conflict. Enforces
        a platform-wide daily withdrawal limit and never allows a negative
        balance. Detects concurrent updates to the same account via
        optimistic locking and returns a conflict to the losing request.
      operationId: withdrawFromAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '201':
          description: The withdrawal succeeded (or replayed an identical prior request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: No resource matches the given identifier
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: The given identifier is not well-formed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: >
        The request conflicts with the current state: either the same
        Idempotency-Key was reused with different parameters, or the
        account was updated concurrently by another request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    CustomerProfileResponse:
      type: object
      required: [id, fullName, email]
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
    AccountSummaryResponse:
      type: object
      required: [id, accountNumber, balance, currency]
      properties:
        id:
          type: string
        accountNumber:
          type: string
        balance:
          type: number
          format: decimal
        currency:
          type: string
    AccountBalanceResponse:
      type: object
      required: [accountId, balance, currency]
      properties:
        accountId:
          type: string
        balance:
          type: number
          format: decimal
        currency:
          type: string
    TransactionSummaryResponse:
      type: object
      required: [id, type, amount, currency, occurredOn]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
          format: decimal
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        description:
          type: string
          nullable: true
    TransactionPageResponse:
      type: object
      description: >
        The cursor-pagination envelope every consumer of this endpoint codes
        against. items is ordered most-recent-first. nextCursor is an opaque
        token: non-null when more results exist beyond this page, null on the
        last page. Never decode or construct a cursor value.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSummaryResponse'
        nextCursor:
          type: string
          nullable: true
    TransactionDetailResponse:
      type: object
      required: [id, accountId, type, amount, currency, occurredOn]
      properties:
        id:
          type: string
        accountId:
          type: string
        type:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
          format: decimal
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        description:
          type: string
          nullable: true
    AnnualInterestSummaryResponse:
      type: object
      required: [accountId, year, openingBalance, closingBalance, interestRate, interestAmount, currency]
      properties:
        accountId:
          type: string
        year:
          type: integer
        openingBalance:
          type: number
          format: decimal
        closingBalance:
          type: number
          format: decimal
        interestRate:
          type: number
          format: decimal
        interestAmount:
          type: number
          format: decimal
        currency:
          type: string
    WithdrawRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: decimal
        currency:
          type: string
    WithdrawalResponse:
      type: object
      required: [transactionId, accountId, amount, currency, occurredOn, newBalance]
      properties:
        transactionId:
          type: string
        accountId:
          type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        newBalance:
          type: number
          format: decimal
    ProblemDetail:
      type: object
      description: RFC 7807 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
