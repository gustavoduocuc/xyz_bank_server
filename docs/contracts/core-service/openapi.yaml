openapi: 3.0.3
info:
  title: core-service — accounts
  description: >
    Internal endpoints for customer profiles, account balances, and PIN
    verification. core-service is the only component with database access;
    these endpoints are internal-network-only and are not exposed through any
    BFF. Every endpoint requires a bearer access token issued by auth-server.
    Domain endpoints require the scope shown in that operation's description.
    PIN verification requires a bff-atm client token. ATM balance and
    withdrawal also require the X-Atm-Session header for the session
    core-service created when the PIN was verified. Web and mobile refresh
    tokens and device revocation live on auth-server, not here.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
security:
  - BearerAuth: []
paths:
  /internal/auth/atm/pin-verifications:
    post:
      summary: Verify a card PIN and open an ATM session
      description: >
        Requires a bff-atm access token (client_credentials). The PIN is accepted only
        in the request body, never a query parameter or path segment. Served
        exclusively over this operation's TLS-only connector (design.md
        Decision 8); the same request over the plain-HTTP connector is
        rejected. On a third consecutive failure the card locks (423);
        further attempts, including a correct PIN, are rejected identically
        until a developer resets it (scripts/reset-dev-card-lock.sh — there
        is no customer-facing unlock path). An unknown card number is
        rejected identically to an incorrect PIN (401), never distinguished,
        to avoid a card-existence oracle.
      operationId: verifyPin
      servers:
        - url: https://localhost:8453
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinVerificationRequest'
      responses:
        '200':
          description: Correct PIN; resets the failure count and returns the new ATM session id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinVerificationResponse'
        '401':
          description: Incorrect PIN or unknown card (indistinguishable)
        '423':
          description: Card is locked (third consecutive failure, or already locked)
  /internal/customers/{customerId}/accounts:
    get:
      summary: List the accounts owned by a customer
      description: Domain endpoint. Requires the `web:accounts:read` scope.
      operationId: listAccountsForCustomer
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: >
            The accounts owned by the customer. An empty array when no
            account is held for that identifier (customer profiles are owned
            by customers-service). A non-owner gets 404.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/accounts/{accountId}/balance:
    get:
      summary: Get an account's current balance
      description: >
        Domain endpoint. Requires one of `web:accounts:read`,
        `mobile:accounts:read`, or `atm:read-balance`, depending on the
        calling channel.
      operationId: getAccountBalance
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/AtmSession'
      responses:
        '200':
          description: The account's current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/accounts/{accountId}/transactions:
    get:
      summary: List an account's transactions
      description: >
        Cursor-paginated, ordered most-recent-first. Pass a previous response's
        nextCursor value back as the cursor parameter to fetch the next page.
        pageSize is capped at 100 (returning fewer items, not an error) and
        defaults to 20 when omitted. Domain endpoint. Requires one of
        `web:transactions:read` or `mobile:transactions:read`, depending on
        the calling channel.
      operationId: listAccountTransactions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: from
          in: query
          description: Inclusive lower date bound (yyyy-MM-dd)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Inclusive upper date bound (yyyy-MM-dd)
          schema:
            type: string
            format: date
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum: [DEBIT, CREDIT]
        - name: cursor
          in: query
          description: >
            Opaque continuation token from a previous page's nextCursor.
            Omit for the first page. Never construct or decode this value.
          schema:
            type: string
        - name: pageSize
          in: query
          description: Maximum items per page. Clamped at 100; defaults to 20.
          schema:
            type: integer
      responses:
        '200':
          description: A page of the account's transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/transactions/{transactionId}:
    get:
      summary: Get a transaction's detail
      description: >
        Domain endpoint. Requires one of `web:transactions:read` or
        `mobile:transactions:read`, depending on the calling channel.
        Ownership resolves through the transaction's account.
      operationId: getTransactionDetail
      security:
        - BearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The transaction's detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/accounts/{accountId}/interest-summary:
    get:
      summary: Get an account's annual interest summary
      description: Domain endpoint. Requires the `web:interests:read` scope.
      operationId: getAnnualInterestSummary
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The account's annual interest summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnualInterestSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/accounts/{accountId}/withdrawals:
    post:
      summary: Withdraw an amount from an account
      description: >
        Requires an Idempotency-Key header: retrying the same key with the
        same account and amount replays the original result rather than
        withdrawing twice; the same key with different parameters is
        rejected as a conflict. Enforces a platform-wide daily withdrawal
        limit and never allows a negative balance. Detects concurrent
        updates to the same account via optimistic locking and returns a
        conflict to the losing request. Domain endpoint. Requires the
        `atm:withdraw` scope.
      operationId: withdrawFromAccount
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/AtmSession'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '201':
          description: The withdrawal succeeded (or replayed an identical prior request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /internal/accounts/{accountId}/interest-credits:
    post:
      summary: Credit annual interest to an account
      description: >
        Service-to-service write used by interests-service. Requires an
        Idempotency-Key header: retrying the same key with the same account
        and amount replays the original result; the same key with different
        parameters is rejected as a conflict. Persists a CREDIT transaction
        and an annual interest summary for the given year; a second credit
        for the same account and year is rejected as a conflict. Detects
        concurrent account updates via optimistic locking. Domain endpoint
        requiring the `interests:write` scope. No customer ownership check
        (service call).
      operationId: creditInterestToAccount
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestCreditRequest'
      responses:
        '201':
          description: The interest credit succeeded (or replayed an identical prior request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestCreditResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        RS256 access token issued by auth-server (iss https://localhost:9000,
        aud core-service). Domain calls carry the end-customer token and its
        channel scopes. PIN verification carries the bff-atm client token.
        ATM balance and withdrawal also send X-Atm-Session.
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    AtmSession:
      name: X-Atm-Session
      in: header
      required: false
      description: >
        Opaque session id returned by PIN verification. Required when the
        bearer token's channel is ATM; ignored for other channels.
      schema:
        type: string
  responses:
    NotFound:
      description: No resource matches the given identifier
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: The given identifier is not well-formed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: >
        The request conflicts with the current state: either the same
        Idempotency-Key was reused with different parameters, or the
        account was updated concurrently by another request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    AccountSummaryResponse:
      type: object
      required: [id, accountNumber, balance, currency]
      properties:
        id:
          type: string
        accountNumber:
          type: string
        balance:
          type: number
          format: decimal
        currency:
          type: string
    AccountBalanceResponse:
      type: object
      required: [accountId, balance, currency]
      properties:
        accountId:
          type: string
        balance:
          type: number
          format: decimal
        currency:
          type: string
    TransactionSummaryResponse:
      type: object
      required: [id, type, amount, currency, occurredOn]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
          format: decimal
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        description:
          type: string
          nullable: true
    TransactionPageResponse:
      type: object
      description: >
        The cursor-pagination envelope every consumer of this endpoint codes
        against. items is ordered most-recent-first. nextCursor is an opaque
        token: non-null when more results exist beyond this page, null on the
        last page. Never decode or construct a cursor value.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionSummaryResponse'
        nextCursor:
          type: string
          nullable: true
    TransactionDetailResponse:
      type: object
      required: [id, accountId, type, amount, currency, occurredOn]
      properties:
        id:
          type: string
        accountId:
          type: string
        type:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
          format: decimal
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        description:
          type: string
          nullable: true
    AnnualInterestSummaryResponse:
      type: object
      required: [accountId, year, openingBalance, closingBalance, interestRate, interestAmount, currency]
      properties:
        accountId:
          type: string
        year:
          type: integer
        openingBalance:
          type: number
          format: decimal
        closingBalance:
          type: number
          format: decimal
        interestRate:
          type: number
          format: decimal
        interestAmount:
          type: number
          format: decimal
        currency:
          type: string
    WithdrawRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: decimal
        currency:
          type: string
    WithdrawalResponse:
      type: object
      required: [transactionId, accountId, amount, currency, occurredOn, newBalance]
      properties:
        transactionId:
          type: string
        accountId:
          type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        newBalance:
          type: number
          format: decimal
    InterestCreditRequest:
      type: object
      required: [year, amount, currency, interestRate, openingBalance, closingBalance]
      properties:
        year:
          type: integer
        amount:
          type: number
          format: decimal
        currency:
          type: string
        interestRate:
          type: number
          format: decimal
        openingBalance:
          type: number
          format: decimal
        closingBalance:
          type: number
          format: decimal
    InterestCreditResponse:
      type: object
      required: [transactionId, accountId, year, amount, currency, occurredOn, newBalance]
      properties:
        transactionId:
          type: string
        accountId:
          type: string
        year:
          type: integer
        amount:
          type: number
          format: decimal
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        newBalance:
          type: number
          format: decimal
    PinVerificationRequest:
      type: object
      required: [cardNumber, pin]
      properties:
        cardNumber:
          type: string
        pin:
          type: string
    PinVerificationResponse:
      type: object
      required: [customerId, atmSessionId]
      properties:
        customerId:
          type: string
        atmSessionId:
          type: string
          description: Opaque id the ATM channel sends back as X-Atm-Session
    ProblemDetail:
      type: object
      description: RFC 7807 problem details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
