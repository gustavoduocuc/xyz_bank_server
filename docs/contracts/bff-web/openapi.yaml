openapi: 3.0.3
info:
  title: bff-web
  description: >
    Web channel backend-for-frontend. Aggregates core-service data into full
    payloads for the dashboard, filterable transaction history, and annual
    interest view. Does not access any database. The browser authenticates
    via an httpOnly `session` cookie (a short-lived JWT) obtained through an
    OIDC login redirect and renewed via /session/refresh; unsafe methods also
    require the double-submit `X-XSRF-TOKEN` header/`XSRF-TOKEN` cookie pair.
  version: "1.0.0"
servers:
  - url: https://localhost:8081
security:
  - SessionCookie: []
paths:
  /oauth2/authorization/oidc:
    get:
      summary: Start the OIDC login redirect
      description: >
        Browser-redirect flow, not a JSON API: redirects to the identity
        provider's authorization endpoint (PKCE-enabled). On successful
        login, the provider redirects back to
        /login/oauth2/code/oidc, which this service handles internally by
        minting the session/refresh_token/XSRF-TOKEN cookies and redirecting
        the browser to the SPA. Neither leg returns a JSON body.
      operationId: startOidcLogin
      security: []
      responses:
        '302':
          description: Redirect to the identity provider
  /session/refresh:
    post:
      summary: Rotate the session using the refresh_token cookie
      description: >
        Reachable without a valid session cookie -- that is the point of a
        refresh endpoint -- but requires the httpOnly refresh_token cookie.
        On success, rotates session/refresh_token/XSRF-TOKEN cookies. On
        failure, clears all session cookies.
      operationId: refreshSession
      security: []
      responses:
        '204':
          description: Session rotated; new cookies set on the response
        '401':
          description: Missing, invalid, or already-rotated refresh token; cookies cleared
  /customers/{customerId}/dashboard:
    get:
      summary: Dashboard aggregate
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Profile, every account with balance, and latest transactions per account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /customers/{customerId}/notifications:
    get:
      summary: Customer notification feed
      description: >
        The customer's latest 50 security alerts and confirmed movements, newest
        first, as customers-service reports them. Only the logged-in customer's
        own feed is served.
      operationId: getNotifications
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: The feed (empty when there is nothing yet)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /accounts/{accountId}/transactions:
    get:
      summary: Full transaction history
      operationId: getTransactionHistory
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: type
          in: query
          schema:
            type: string
            enum: [DEBIT, CREDIT]
        - name: cursor
          in: query
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: A page of filtered transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionHistoryResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /accounts/{accountId}/interest-summary:
    get:
      summary: Annual interest view
      operationId: getInterestView
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Annual interest summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestViewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: >
        Short-lived HS256 JWT set as an httpOnly, Secure, SameSite=Lax
        cookie after a successful OIDC login or /session/refresh call.
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
  responses:
    Forbidden:
      description: Caller channel is not web
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: No resource matches the given identifier
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Missing or invalid session cookie, or an invalid request filter
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    Notification:
      type: object
      required: [eventId, kind, occurredAt]
      properties:
        eventId:
          type: string
          description: Id of the event that produced the entry; one entry per event id
        kind:
          type: string
          enum: [TRANSACTION_CONFIRMED, CARD_LOCKED, REFRESH_TOKEN_REUSE]
        occurredAt:
          type: string
          format: date-time
        accountId:
          type: string
          description: Only on TRANSACTION_CONFIRMED
        type:
          type: string
          description: Only on TRANSACTION_CONFIRMED (WITHDRAWAL, INTEREST_CREDIT, PAYMENT_DEBIT or PAYMENT_CREDIT)
        amount:
          type: number
          description: Only on TRANSACTION_CONFIRMED
        currency:
          type: string
          description: Only on TRANSACTION_CONFIRMED
    DashboardResponse:
      type: object
      required: [profile, accounts]
      properties:
        profile:
          $ref: '#/components/schemas/CustomerProfile'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
    CustomerProfile:
      type: object
      required: [id, fullName, email]
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
    AccountSummary:
      type: object
      required: [id, accountNumber, balance, currency, transactions]
      properties:
        id:
          type: string
        accountNumber:
          type: string
        balance:
          type: number
        currency:
          type: string
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/RecentTransaction'
    RecentTransaction:
      type: object
      required: [id, type, amount, currency, occurredOn]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [DEBIT, CREDIT]
        amount:
          type: number
        currency:
          type: string
        occurredOn:
          type: string
          format: date
        description:
          type: string
          nullable: true
    TransactionHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecentTransaction'
        nextCursor:
          type: string
          nullable: true
    InterestViewResponse:
      type: object
      required: [accountId, year, openingBalance, closingBalance, interestRate, interestAmount, currency]
      properties:
        accountId:
          type: string
        year:
          type: integer
        openingBalance:
          type: number
        closingBalance:
          type: number
        interestRate:
          type: number
        interestAmount:
          type: number
        currency:
          type: string
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
